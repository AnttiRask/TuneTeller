name: Deploy to Cloud Run

# Deploys on pushes to main that change the app or how it is built (not docs,
# tests or the plan), and on demand: Actions tab > "Deploy to Cloud Run" > Run
# workflow. The tests run first and must pass. Keep the service flags in sync
# with deploy.sh.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "renv.lock"
      - ".Rprofile"
      - "renv/activate.R"
      - "renv/settings.json"
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

permissions:
  contents: read

# Not secrets: the project id and number appear in every Cloud Run URL
env:
  PROJECT_ID: tuneteller-app
  PROJECT_NUMBER: "658789231217"
  REGION: europe-north1
  SERVICE: tuneteller-app

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write  # keyless Google Cloud login (Workload Identity Federation)

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only this repo's main branch can use the pool (see the provider's
      # attribute condition); the account can deploy this one service and nothing else
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/tuneteller/providers/github-oidc
          service_account: tuneteller-deploy@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # No --allow-unauthenticated: the service is already public and the deploy
      # account may not change IAM
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --service-account "tuneteller-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --set-secrets "OPENAI_API_KEY=openai-api-key:latest" \
            --set-secrets "SPOTIFY_CLIENT_ID=spotify-client-id:latest" \
            --set-secrets "SPOTIFY_CLIENT_SECRET=spotify-client-secret:latest" \
            --memory 1Gi \
            --timeout 3600 \
            --session-affinity \
            --update-labels "git-sha=${GITHUB_SHA::12}" \
            --quiet

      - name: Smoke test the deployed service
        run: |
          DESCRIBE_FORMAT='value(status.url,metadata.labels.git-sha)'
          read -r URL LABEL < <(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format="$DESCRIBE_FORMAT")
          echo "Service URL: $URL"
          echo "Deployed commit label: $LABEL (this run: ${GITHUB_SHA::12})"
          if [ "$LABEL" != "${GITHUB_SHA::12}" ]; then
            echo "The service doesn't carry this commit's label"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$URL/" || true)
            echo "Attempt $attempt: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "OK"
              exit 0
            fi
            sleep 10
          done
          echo "Service did not return HTTP 200"
          exit 1
